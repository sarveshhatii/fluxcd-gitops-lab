apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-website
  namespace: gitops-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitops-website
  template:
    metadata:
      labels:
        app: gitops-website
    spec:
      containers:
        - name: website
          image: sarvesh8415/fluxcd-gitops-lab:1.0.3 # {"$imagepolicy": "flux-system:gitops-website"}
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 64Mi
